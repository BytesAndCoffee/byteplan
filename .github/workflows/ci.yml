name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install hatch
      - run: hatch test --python ${{ matrix.python }}
      - name: Native Windows control-junction regression
        if: matrix.os == 'windows-latest' && matrix.python == '3.12'
        run: hatch test --python 3.12 -- -v tests/test_persistence.py::test_native_windows_control_junction_is_rejected_before_cleanup

  released-clients:
    name: released-client compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install hatch
      - run: hatch test --python 3.12 -- -m network tests/test_released_clients.py

  quality:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install hatch
      - run: hatch fmt --check
      - run: hatch run types:check
      - name: byteplan-runtime
        working-directory: byteplan-runtime
        run: |
          hatch test
          hatch fmt --check
          hatch run types:check

  byteplan:
    # Dogfooding: BytePlan checks that this commit's code and .byteplan/tasks.json agree,
    # with the same command the docs recommend (docs/ci.md). Read-only; never writes.
    name: BytePlan consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: byteplan check --commit HEAD --format json
