name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install hatch
      - run: hatch test --python ${{ matrix.python }}

  quality:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install hatch
      - run: hatch fmt --check
      - run: hatch run types:check
      - name: byteplan-runtime
        working-directory: byteplan-runtime
        run: |
          hatch test
          hatch fmt --check
          hatch run types:check

  byteplan:
    # Dogfooding: BytePlan checks that this commit's code and .byteplan/tasks.json agree,
    # with the same command the docs recommend (docs/ci.md). Read-only; never writes.
    name: BytePlan consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: byteplan check --commit HEAD --format json
