[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "byteplan"
dynamic = ["version"]
description = 'Plan in code. Track in one place.'
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = ["todo", "fixme", "task-tracking", "hatch", "developer-tools"]
authors = [
  { name = "Michael Yazdani", email = "yazdmich@gmail.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: Hatch",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pathspec>=1.0",
]

[project.optional-dependencies]
# `byteplan mcp`: the official MCP SDK (2.x renamed FastMCP to MCPServer).
mcp = ["mcp>=2.3,<3"]

[project.scripts]
byteplan = "byteplan.cli:main"
byteplan-mcp = "byteplan.mcp_server:main"

# Hatchling discovers the build hook through this entry point; projects enable
# it with [tool.hatch.build.hooks.byteplan]. BytePlan doesn't enable it for its
# own build (that would need byteplan to build itself); use `hatch run byteplan scan`.
[project.entry-points.hatch]
byteplan = "byteplan.hatch_hook"

[project.urls]
Documentation = "https://github.com/BytesAndCoffee/byteplan#readme"
Issues = "https://github.com/BytesAndCoffee/byteplan/issues"
Source = "https://github.com/BytesAndCoffee/byteplan"

# BytePlan tracks its own development. Tests are out of scope: they deliberately
# contain @todo / @verifies / stub fixtures that aren't real work.
[tool.byteplan]
registry = ".byteplan/tasks.json"
include = ["src/**/*.py", "byteplan-runtime/src/**/*.py", "scripts/**/*.py", "tests/**/*.py", "**/*.md"]
report_file = "byteplan.md"
# Pull requests leave byteplan.md alone; .github/workflows/report.yml regenerates it on main.
report_branch = "main"

[tool.byteplan.tests]
# `byteplan verify` runs pytest in the hatch-test environment (the default one has no pytest).
runner = ["hatch", "test", "--"]

[tool.byteplan.tests.scaffold]
# Every new task in src/ starts with an acceptance test: an xfail(strict=True) placeholder, so
# CI stays green until the work is done and then flags the placeholder as passing.
auto = true
policy = "xfail"
link_style = "managed"

[tool.byteplan.annotations]
# Decorator mode: `byteplan sync` turns attached TODO comments into @todo(...) and decorates
# unowned stubs. The decorators import from an inert in-package shim, so BytePlan gains no
# runtime dependency (written by `byteplan init --runtime-shim src/byteplan/_todo.py`).
mode = "decorator"
convert_attached_comments = true
auto_decorate_stubs = true
runtime_modules = ["byteplan_runtime", "byteplan._todo"]

[tool.hatch.version]
path = "src/byteplan/__about__.py"

[tool.hatch.build.targets.sdist]
exclude = [
  ".byteplan",
  "docs/spec*.md",
  # A separate distribution that lives in this repository; see its own pyproject.toml.
  "byteplan-runtime",
]

[tool.hatch.build.targets.wheel]
packages = ["src/byteplan"]

# `hatch run byteplan mcp`: the MCP server for agents working on BytePlan itself.
[tool.hatch.envs.default]
features = ["mcp"]

[tool.hatch.envs.hatch-test]
features = ["mcp"]
extra-dependencies = [
  "build",
  "hatchling",
  "pip",  # isolated PEP 517 builds in the `network` tests
]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.types]
features = ["mcp"]
extra-dependencies = [
  "mypy>=1.0.0",
  "pytest",
  "hatchling",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/byteplan scripts tests}"

[tool.mypy]
strict = true
python_version = "3.11"

# byteplan-runtime supports Python 3.8 and is linted by its own project config.
# Not `extend-exclude`: Hatch skips injecting its default ruff rules into any
# [tool.ruff] table containing a line that starts with "extend".
[tool.ruff]
lint.exclude = ["**/byteplan-runtime/**"]
format.exclude = ["**/byteplan-runtime/**"]
lint.extend-per-file-ignores = { "examples/*" = ["INP001"] }  # standalone files to copy, not a package
# flake8-todos TD004 wants `TODO:`; BytePlan's IDs make it `TODO[a6b2]:` (see README, "Linters").
lint.extend-ignore = ["TD004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: needs network access (isolated PEP 517 builds)",
]
addopts = "-m 'not network'"
filterwarnings = ["error"]

[tool.coverage.run]
source_pkgs = ["byteplan", "tests"]
branch = true
parallel = true
omit = [
  "src/byteplan/__about__.py",
  # Runs inside `byteplan verify`'s pytest subprocesses from a copied file, so coverage can't
  # attribute it; tests/test_verify.py exercises every hook end to end.
  "src/byteplan/_verify_plugin.py",
]

[tool.coverage.paths]
byteplan = ["src/byteplan", "*/byteplan/src/byteplan"]
tests = ["tests", "*/byteplan/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
